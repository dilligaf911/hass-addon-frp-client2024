name: "FRP Client"
description: "FRP client for Home Assistant. Configuration is managed through /share/frpc.toml"
version: "1.0.4"
slug: "frp_client"
host_network: true
startup: application
boot: "auto"
init: false
map:
  - "share:rw"
privileged:
  - NET_ADMIN
devices:
  - /dev/net/tun
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
options: {}
schema: {}
